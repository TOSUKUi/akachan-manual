name: CI and Deploy (GitHub Pages)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # src/generated/ は生成物（.gitignore）なので CI で先に生成する
      - run: npm run gen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx prettier --check .
      # 出典リンクの生死。外部サイトの一時障害で配備が止まらないよう continue-on-error。
      # 死リンクはここに出る＝次の修正で直す対象。ローカルでは同じコマンドが exit 1 で止まる。
      - name: URL liveness (non-blocking)
        continue-on-error: true
        run: node scripts/check-links.mjs --workers 8

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen
      # gen（fact/*.md → site-data）は build スクリプト内で実行される
      - run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
