<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>あかちゃんマニュアル｜生まれてから 2 歳までをパパが把握できるガイド（品川区）</title>
    <meta
      name="description"
      content="生まれる予定の男性向け。出産当日の動き方から 2 歳までの育児知識・手続きを 9 章でまとめ、全事実に公式ソースへのリンクを付けている。品川区在住の世帯向け。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ハッシュジャンプ（SSG + 水合対策）：初期レイアウト後と水合後に各 1 回。
      ;(function () {
        function jump() {
          if (!location.hash) return
          var id = decodeURIComponent(location.hash.slice(1))
          if (id === 'top') { window.scrollTo(0, 0); return }
          var el = document.getElementById(id)
          if (el) el.scrollIntoView()
        }
        requestAnimationFrame(jump)
        setTimeout(jump, 600)
      })()
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
